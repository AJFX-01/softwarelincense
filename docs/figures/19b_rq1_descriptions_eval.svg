<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs><rect width="1600" height="720" fill="#FFFFFF"/><text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#222" text-anchor="start">Part B · Turning profiles into realistic descriptions, then testing Stage 1</text><text x="40" y="80" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#555" text-anchor="start">Profiles are rewritten as everyday project descriptions; the system must find the right licenses from the words alone</text><rect x="40" y="170" width="230" height="200" rx="10" fill="#EAF5EA" stroke="#2E7D32" stroke-width="1.8"/><text x="54" y="198" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="start">77 profiles</text><text x="54" y="222" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">from Part A:</text><text x="54" y="242.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">requirements +</text><text x="54" y="263.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">answer key</text><rect x="300" y="170" width="270" height="200" rx="10" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.8"/><text x="314" y="198" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6B4FBB" text-anchor="start">6 · Write</text><text x="314" y="222" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">an AI model (Qwen) writes</text><text x="314" y="242.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">~3 everyday descriptions</text><text x="314" y="263.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">per profile, without naming</text><text x="314" y="283.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#333" text-anchor="start">any license → 235</text><rect x="590" y="170" width="270" height="200" rx="10" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.8"/><text x="604" y="198" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6B4FBB" text-anchor="start">7 · Check</text><text x="604" y="222" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">a second AI model reads each</text><text x="604" y="242.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">description without seeing</text><text x="604" y="263.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">the profile and lists the</text><text x="604" y="283.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">requirements it can spot</text><rect x="880" y="170" width="270" height="200" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="894" y="198" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start">8 · Keep matches</text><text x="894" y="222" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">kept only if it spots</text><text x="894" y="242.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">exactly the profile&#x27;s</text><text x="894" y="263.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">requirements</text><text x="894" y="283.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#333" text-anchor="start">190 kept · 45 dropped</text><rect x="1170" y="170" width="270" height="200" rx="10" fill="#EAF5EA" stroke="#2E7D32" stroke-width="1.8"/><text x="1184" y="198" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="start">9 · Test Stage 1</text><text x="1184" y="222" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">our system (gpt-oss-120b)</text><text x="1184" y="242.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">reads the description only</text><text x="1184" y="263.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">and picks 3 licenses</text><text x="1184" y="283.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">→ compared with answer key</text><path d="M 270 270.0 L 296 270.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 570 270.0 L 586 270.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 860 270.0 L 876 270.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 1150 270.0 L 1166 270.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 155 170 L 155 136 L 1305.0 136 L 1305.0 166" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#ah)"/><text x="720" y="128" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#2E7D32" text-anchor="start" font-style="italic">answer key (used only for scoring)</text><rect x="1460" y="170" width="110" height="200" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="1515" y="260" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#2E7D32" text-anchor="middle">104</text><text x="1515" y="285" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">tested</text><text x="1515" y="305" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">all 70</text><text x="1515" y="323" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">profiles</text><path d="M 1440 270.0 L 1456 270.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="420" width="760" height="260" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="54" y="448" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F6DB5" text-anchor="start">Example: one description, start to finish</text><text x="54" y="472" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">Profile: “users don&#x27;t need to credit us”</text><text x="54" y="492.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start"></text><text x="54" y="513.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">Step 6 — Qwen wrote: “… I&#x27;d like the code to be treated like it belongs to</text><text x="54" y="533.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">no one, so users don&#x27;t even have to worry about keeping a copyright</text><text x="54" y="554.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">notice in their forks.”</text><text x="54" y="574.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">Step 7 — the checker found: “no credit needed” and nothing else</text><text x="54" y="595.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">Step 8 — exact match → kept</text><text x="54" y="615.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">Step 9 — our system&#x27;s 3 picks are scored against the answer key</text><rect x="830" y="420" width="740" height="260" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="844" y="448" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start">How Stage 1 is scored</text><text x="844" y="472" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">Hit@1 — the first pick is one of the correct licenses</text><text x="844" y="492.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">Hit@3 — at least one of the three picks is correct</text><text x="844" y="513.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">Precision@3 — how many of the three picks are correct</text><text x="844" y="533.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">Broken requirement — a pick that ignores something the</text><text x="844" y="554.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">developer asked for (e.g. “trademarks protected”)</text><text x="844" y="574.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start"></text><text x="844" y="595.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">Why 104 and not 190? The free AI service allows a limited</text><text x="844" y="615.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">amount of text per day, so one description per profile ran</text><text x="844" y="636.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">first — every profile is still tested at least once.</text></svg>