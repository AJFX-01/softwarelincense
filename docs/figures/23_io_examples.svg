<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs><rect width="1600" height="1010" fill="#FFFFFF"/><text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#222" text-anchor="start" xml:space="preserve">What goes in and what comes out</text><text x="40" y="80" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#555" text-anchor="start" xml:space="preserve">Two kinds of input (either or both) → the LicenseWise pipeline → the same result as readable text or as JSON</text><text x="40" y="122" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#888" text-anchor="start" xml:space="preserve">INPUT</text><text x="900" y="122" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#888" text-anchor="start" xml:space="preserve">OUTPUT</text><rect x="40" y="135" width="760" height="175" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="54" y="163" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F6DB5" text-anchor="start" xml:space="preserve">Input 1 · Project description (plain text)</text><text x="54" y="187" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">“A desktop app for small clinics to manage appointments.</text><text x="54" y="208" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve"> I&#x27;d like to be able to sell it.”</text><text x="54" y="229" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve"></text><text x="54" y="250" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">Any length up to 4,000 characters · no license terms needed</text><rect x="40" y="330" width="370" height="330" rx="10" fill="#F7F7F5" stroke="#C8C8C4" stroke-width="1.5"/><text x="56" y="358" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#D9822B" text-anchor="start" xml:space="preserve">Input 2a · requirements.txt</text><text x="56" y="386" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">requests&gt;=2.31</text><text x="56" y="406" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">numpy==2.1.0  # arrays</text><text x="56" y="426" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">django</text><text x="56" y="446" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">pyqt5</text><text x="56" y="466" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">black[jupyter]</text><text x="56" y="486" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#9A9A95" text-anchor="start" xml:space="preserve">-r other.txt          ← skipped</text><text x="56" y="506" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">this-package-does-not-exist-xyz</text><rect x="430" y="330" width="370" height="330" rx="10" fill="#F7F7F5" stroke="#C8C8C4" stroke-width="1.5"/><text x="446" y="358" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#D9822B" text-anchor="start" xml:space="preserve">Input 2b · package.json (npm)</text><text x="446" y="386" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">{</text><text x="446" y="406" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">  &quot;name&quot;: &quot;demo&quot;,</text><text x="446" y="426" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">  &quot;dependencies&quot;: {</text><text x="446" y="446" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">    &quot;react&quot;: &quot;^18.0.0&quot;,</text><text x="446" y="466" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">    &quot;lodash&quot;: &quot;^4.17.0&quot;,</text><text x="446" y="486" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">    &quot;left-pad&quot;: &quot;1.3.0&quot;</text><text x="446" y="506" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">  },</text><text x="446" y="526" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#9A9A95" text-anchor="start" xml:space="preserve">  &quot;devDependencies&quot;: {</text><text x="446" y="546" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#9A9A95" text-anchor="start" xml:space="preserve">    &quot;jest&quot;: &quot;^29.0.0&quot;   ← ignored</text><text x="446" y="566" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#9A9A95" text-anchor="start" xml:space="preserve">  }</text><text x="446" y="586" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">}</text><text x="40" y="690" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#555" text-anchor="start" xml:space="preserve">Also accepted: pyproject.toml ([project] dependencies). Files are only read, never run.</text><rect x="40" y="715" width="760" height="120" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="54" y="743" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start" xml:space="preserve">Input checks</text><text x="54" y="767" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">file type: requirements.txt · pyproject.toml · package.json only</text><text x="54" y="787" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">size ≤ 100 KB · must parse · description ≤ 4,000 characters</text><rect x="818" y="135" width="64" height="700" rx="12" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="850" y="300" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F6DB5" text-anchor="middle" xml:space="preserve">L</text><text x="850" y="330" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F6DB5" text-anchor="middle" xml:space="preserve">i</text><text x="850" y="360" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F6DB5" text-anchor="middle" xml:space="preserve">c</text><text x="850" y="390" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F6DB5" text-anchor="middle" xml:space="preserve">e</text><text x="850" y="420" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F6DB5" text-anchor="middle" xml:space="preserve">n</text><text x="850" y="450" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F6DB5" text-anchor="middle" xml:space="preserve">s</text><text x="850" y="480" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F6DB5" text-anchor="middle" xml:space="preserve">e</text><text x="850" y="510" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F6DB5" text-anchor="middle" xml:space="preserve">W</text><text x="850" y="540" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F6DB5" text-anchor="middle" xml:space="preserve">i</text><text x="850" y="570" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F6DB5" text-anchor="middle" xml:space="preserve">s</text><text x="850" y="600" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F6DB5" text-anchor="middle" xml:space="preserve">e</text><path d="M 800 222 L 814 222" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 800 495 L 814 495" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 882 300 L 896 300" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 882 720 L 896 720" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="900" y="135" width="660" height="395" rx="10" fill="#F7F7F5" stroke="#C8C8C4" stroke-width="1.5"/><text x="916" y="163" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#2E7D32" text-anchor="start" xml:space="preserve">Output 1 · Readable result (UI cards / command line)</text><text x="916" y="191" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">Requirements understood:</text><text x="916" y="211" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">  - Must allow commercial distribution and sale.</text><text x="916" y="231" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#B45309" text-anchor="start" xml:space="preserve">  ! pyqt5 (GPL-3.0-only): requires a GPL-compatible</text><text x="916" y="251" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#B45309" text-anchor="start" xml:space="preserve">    license</text><text x="916" y="271" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve"></text><text x="916" y="291" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#111" text-anchor="start" xml:space="preserve">1. GPL-3.0 — satisfies commercial sale and meets</text><text x="916" y="311" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">   pyqt5&#x27;s GPL-3.0-only requirement</text><text x="916" y="331" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2E7D32" text-anchor="start" xml:space="preserve">   [verified]   You may charge any price or no price</text><text x="916" y="351" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2E7D32" text-anchor="start" xml:space="preserve">                for each copy you distribute …</text><text x="916" y="371" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#B45309" text-anchor="start" xml:space="preserve">   [unverified] Any work you convey must be licensed</text><text x="916" y="391" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#B45309" text-anchor="start" xml:space="preserve">                as a whole under GPL-3.0.</text><text x="916" y="411" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">2. AGPL-3.0 …   3. EPL-2.0 …</text><text x="916" y="431" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#9A9A95" text-anchor="start" xml:space="preserve">Explanations are based on license text only.</text><text x="916" y="451" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#9A9A95" text-anchor="start" xml:space="preserve">Not legal advice.</text><rect x="900" y="550" width="660" height="430" rx="10" fill="#F7F7F5" stroke="#C8C8C4" stroke-width="1.5"/><text x="916" y="578" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#2E7D32" text-anchor="start" xml:space="preserve">Output 2 · JSON (API response / Download JSON)</text><text x="916" y="606" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">{</text><text x="916" y="626" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">  &quot;dependencies&quot;: [ {&quot;name&quot;: &quot;pyqt5&quot;,</text><text x="916" y="646" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">                     &quot;license&quot;: &quot;GPL-3.0-only&quot;}, … ],</text><text x="916" y