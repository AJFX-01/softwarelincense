<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="690" viewBox="0 0 1600 690"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs><rect width="1600" height="690" fill="#FFFFFF"/><text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#222" text-anchor="start">Part A · Building requirement profiles and their correct answers</text><text x="40" y="80" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#555" text-anchor="start">We decide what a developer might ask for, then work out which licenses fit — straight from the license labels</text><rect x="40" y="120" width="290" height="200" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="54" y="148" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F6DB5" text-anchor="start">1 · Choose requirements</text><text x="54" y="172" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">6 things a developer might</text><text x="54" y="192.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">ask for, taken from the</text><text x="54" y="213.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">license labels (e.g. “share</text><text x="54" y="233.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#333" text-anchor="start">changes”, “patent grant”)</text><rect x="54" y="280" width="124.39999999999999" height="26" rx="13" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.4"/><text x="116.19999999999999" y="298" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">license labels</text><rect x="352" y="120" width="290" height="200" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="366" y="148" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start">2 · Every combination</text><text x="366" y="172" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">each requirement: pick an</text><text x="366" y="192.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">option or “don&#x27;t care”</text><text x="366" y="213.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start"></text><text x="366" y="233.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#333" text-anchor="start">= 192 combinations</text><rect x="664" y="120" width="290" height="200" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="678" y="148" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start">3 · Drop the empty one</text><text x="678" y="172" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">“don&#x27;t care” about</text><text x="678" y="192.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">everything is not a</text><text x="678" y="213.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">real request</text><text x="678" y="233.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#333" text-anchor="start">192 − 1 = 191</text><rect x="976" y="120" width="290" height="200" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="990" y="148" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start">4 · Which licenses fit?</text><text x="990" y="172" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">check every request against</text><text x="990" y="192.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">all 34 licenses&#x27; labels</text><text x="990" y="213.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">114 → none fit → dropped</text><text x="990" y="233.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#333" text-anchor="start">77 → at least one fits</text><rect x="990" y="280" width="124.39999999999999" height="26" rx="13" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.4"/><text x="1052.2" y="298" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">license labels</text><rect x="1288" y="120" width="290" height="200" rx="10" fill="#EAF5EA" stroke="#2E7D32" stroke-width="1.8"/><text x="1302" y="148" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="start">5 · 77 profiles</text><text x="1302" y="172" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">each profile = its</text><text x="1302" y="192.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">requirements + the list of</text><text x="1302" y="213.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">licenses that fit them</text><text x="1302" y="233.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#333" text-anchor="start">= the answer key</text><rect x="1302" y="280" width="78.8" height="26" rx="13" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.4"/><text x="1341.4" y="298" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">profiles</text><path d="M 330 220.0 L 348 220.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 642 220.0 L 660 220.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 954 220.0 L 972 220.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 1266 220.0 L 1284 220.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="976" y="350" width="290" height="64" rx="10" fill="#FDF0F0" stroke="#B91C1C" stroke-width="1.8"/><text x="1121.0" y="378" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#B91C1C" text-anchor="middle">114 dropped</text><text x="1121.0" y="402" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#333" text-anchor="middle">no license meets all requirements</text><path d="M 1121.0 320 L 1121.0 346" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="470" width="740" height="180" rx="10" fill="#FDF0F0" stroke="#B91C1C" stroke-width="1.8"/><text x="54" y="498" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#B91C1C" text-anchor="start">Example of a request that is dropped</text><text x="54" y="522" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start">Requirements: “keep our trademarks protected” + “users don&#x27;t need to credit us”</text><text x="54" y="543" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start"></text><text x="54" y="564" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start">Every license that protects trademarks also requires users to keep</text><text x="54" y="585" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start">the copyright notice (to credit the authors).</text><text x="54" y="606" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start">→ No license can do both, so this request has no correct answer and is dropped.</text><rect x="820" y="470" width="740" height="180" rx="10" fill="#EAF5EA" stroke="#2E7D32" stroke-width="1.8"/><text x="834" y="498" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="start">Example of a request that is kept</text><text x="834" y="522" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start">Requirements: “changes must be shared with everyone”</text><text x="834" y="543" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start">+ “this also applies when it runs as an online service”</text><text x="834" y="564" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start">+ “contributors must grant patent rights”</text><text x="834" y="585" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start"></text><text x="834" y="606" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start">Licenses that fit (the answer key):</text><text x="834" y="627" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#333" text-anchor="start">AGPL-3.0 · CeCILL-2.1 · EUPL-1.1 · EUPL-1.2 · OSL-3.0</text></svg>