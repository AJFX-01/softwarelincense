<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#222" text-anchor="start">Ground truth for RQ2: clause–claim pairs and the human check</text><text x="40" y="80" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#555" text-anchor="start">Each clause yields three pairs with known answers; a hand-checked sample measures how reliable those answers are</text><rect x="40" y="140" width="420" height="230" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="54" y="168" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F6DB5" text-anchor="start">One clause + one label</text><text x="54" y="192" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">MIT · “no warranty”:</text><text x="54" y="212.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">“THE SOFTWARE IS PROVIDED</text><text x="54" y="233.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">“AS IS”, WITHOUT WARRANTY OF</text><text x="54" y="253.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">ANY KIND, EXPRESS OR IMPLIED …”</text><rect x="540" y="130" width="640" height="100" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="554" y="158" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start">True claim</text><text x="554" y="182" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">“The software is provided without any warranty.”</text><rect x="1220" y="145" width="200" height="70" rx="10" fill="#EAF5EA" stroke="#2E7D32" stroke-width="1.8"/><text x="1320.0" y="173" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#2E7D32" text-anchor="middle">entailment</text><path d="M 460 255 L 536 180" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 1180 180 L 1216 180" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="540" y="260" width="640" height="100" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="554" y="288" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start">Negated claim</text><text x="554" y="312" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">“The software comes with a warranty.”</text><rect x="1220" y="275" width="200" height="70" rx="10" fill="#FDF0F0" stroke="#B91C1C" stroke-width="1.8"/><text x="1320.0" y="303" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#B91C1C" text-anchor="middle">contradiction</text><path d="M 460 255 L 536 310" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 1180 310 L 1216 310" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="540" y="390" width="640" height="100" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="554" y="418" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start">Off-topic claim</text><text x="554" y="442" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">“The license does not grant rights to use trademarks.”</text><rect x="1220" y="405" width="200" height="70" rx="10" fill="#F4F4F2" stroke="#8A8A85" stroke-width="1.8"/><text x="1320.0" y="433" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#8A8A85" text-anchor="middle">neutral</text><path d="M 460 255 L 536 440" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 1180 440 L 1216 440" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="1440" y="130" width="120" height="360" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="1500" y="280" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#2F6DB5" text-anchor="middle">729</text><text x="1500" y="305" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#444" text-anchor="middle">pairs</text><text x="1500" y="340" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="middle">243 each</text><text x="1500" y="360" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="middle">33 licenses</text><text x="1500" y="380" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="middle">16 templates</text><text x="40" y="560" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222" text-anchor="start">Checking the automatic answers by hand</text><rect x="40" y="580" width="300" height="120" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="54" y="608" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F6DB5" text-anchor="start">Sample 150</text><text x="54" y="632" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">50 per answer type,</text><text x="54" y="652" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">fixed random seed</text><path d="M 340 640 L 366 640" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="370" y="580" width="300" height="120" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="384" y="608" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F6DB5" text-anchor="start">2 annotators</text><text x="384" y="632" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">75 pairs each,</text><text x="384" y="652" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">judge from the clause only</text><path d="M 670 640 L 696 640" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="700" y="580" width="300" height="120" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="714" y="608" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F6DB5" text-anchor="start">Settle 22 disagreements</text><text x="714" y="632" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">team decides;</text><text x="714" y="652" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">3 ambiguous → excluded</text><path d="M 1000 640 L 1026 640" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="1030" y="580" width="300" height="120" rx="10" fill="#EAF5EA" stroke="#2E7D32" stroke-width="1.8"/><text x="1044" y="608" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="start">146 labelled pairs</text><text x="1044" y="632" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">after a clause fix:</text><text x="1044" y="652" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">127 carried, 23 relabelled</text><path d="M 1330 640 L 1356 640" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="1360" y="580" width="200" height="120" rx="10" fill="#EAF5EA" stroke="#2E7D32" stroke-width="1.8"/><text x="1374" y="608" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="start">Result</text><text x="1374" y="632" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="start">κ = 0.88</text><text x="1374" y="652" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">auto labels</text><text x="1374" y="672" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">97.9% correct</text><text x="40" y="760" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#555" text-anchor="start">κ (Cohen&#x27;s kappa) = agreement between the two annotators on 39 pairs both labelled, corrected for chance; 0.88 is “almost perfect”.</text><text x="40" y="785" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#555" text-anchor="start">“97.9% correct” = the automatic answers match the final human labels on 143 of 146 pairs, so the full 729-pair set can be trusted.</text></svg>