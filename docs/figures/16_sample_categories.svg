="middle">Clean</text><text x="1420.0" y="162" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">10,436 · 52%</text><text x="1420.0" y="182" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">one in-scope license,</text><text x="1420.0" y="202" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">full confidence</text><path d="M 1420.0 300 L 1420.0 244" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><text x="1430.0" y="275" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#444" text-anchor="start" font-style="italic">yes</text><text x="40" y="700" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2E7D32" text-anchor="start">93.8% of files with a detected license use one of our 34 licenses — the scope covers real-world use.</text></svg>