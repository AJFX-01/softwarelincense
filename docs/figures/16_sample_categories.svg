<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs><rect width="1600" height="720" fill="#FFFFFF"/><text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#222" text-anchor="start">How each of the 20,000 sample files is classified</text><text x="40" y="80" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#555" text-anchor="start">Four yes/no questions, in order, using the ScanCode detections</text><rect x="40" y="300" width="220" height="96" rx="10" fill="#FFF4E5" stroke="#D9822B" stroke-width="1.8"/><text x="150.0" y="328" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D9822B" text-anchor="middle">License file</text><text x="150.0" y="352" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">20,000 in the sample</text><rect x="330" y="300" width="260" height="96" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="460.0" y="328" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">License detected?</text><text x="460.0" y="352" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">yes → right · no → down</text><rect x="650" y="300" width="260" height="96" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="780.0" y="328" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Any license in our 34?</text><text x="780.0" y="352" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">yes → right · no → down</text><rect x="970" y="300" width="260" height="96" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="1100.0" y="328" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Several licenses?</text><text x="1100.0" y="352" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">no → right · yes → down</text><rect x="1290" y="300" width="260" height="96" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="1420.0" y="328" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Confidence = 100?</text><text x="1420.0" y="352" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">yes → right · no → down</text><path d="M 260 348.0 L 326 348.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 590 348.0 L 646 348.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><text x="620.0" y="338.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle" font-style="italic">yes</text><path d="M 910 348.0 L 966 348.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><text x="940.0" y="338.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle" font-style="italic">yes</text><path d="M 1230 348.0 L 1286 348.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><text x="1260.0" y="338.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle" font-style="italic">no</text><rect x="330" y="530" width="260" height="130" rx="10" fill="#F4F4F2" stroke="#8A8A85" stroke-width="1.8"/><text x="460.0" y="558" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#8A8