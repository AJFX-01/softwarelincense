<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs><rect width="1600" height="1060" fill="#FFFFFF"/><text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#222" text-anchor="start">Ground truth for RQ1: how the test set was built, step by step</text><text x="40" y="80" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#555" text-anchor="start">Correct answers are computed from license labels; descriptions are written by one model and checked by another</text><text x="40" y="125" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#2F6DB5" text-anchor="start">A · Building requirement profiles and their correct answers</text><rect x="40" y="140" width="290" height="210" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="54" y="168" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F6DB5" text-anchor="start">1 · Choose requirements</text><text x="54" y="192" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">from the 17 choosealicense labels,</text><text x="54" y="212" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">keep those that differ between</text><text x="54" y="232" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">licenses and that a developer</text><text x="54" y="252" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">would ask for → 6 requirements</text><rect x="54" y="310" width="116.8" height="26" rx="13" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.4"/><text x="112.4" y="328" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">licenses.json</text><rect x="352" y="140" width="290" height="210" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="366" y="168" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start">2 · List every combination</text><text x="366" y="192" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">each requirement: one option</text><text x="366" y="212" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">or “don&#x27;t care”</text><text x="366" y="232" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">4 × 3 × 2 × 2 × 2 × 2</text><text x="366" y="252" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="start">= 192 combinations</text><rect x="366" y="310" width="154.79999999999998" height="26" rx="13" fill="#F4F4F2" stroke="#8A8A85" stroke-width="1.4"/><text x="443.4" y="328" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">build_scenarios.py</text><rect x="664" y="140" width="290" height="210" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="678" y="168" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start">3 · Drop the empty request</text><text x="678" y="192" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">“don&#x27;t care” about everything</text><text x="678" y="212" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">is not a real request</text><text x="678" y="232" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start"></text><text x="678" y="252" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="start">192 − 1 = 191</text><rect x="678" y="310" width="154.79999999999998" height="26" rx="13" fill="#F4F4F2" stroke="#8A8A85" stroke-width="1.4"/><text x="755.4" y="328" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">build_scenarios.py</text><rect x="976" y="140" width="290" height="210" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="990" y="168" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start">4 · Find correct licenses</text><text x="990" y="192" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">test each request against the</text><text x="990" y="212" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">labels of all 34 licenses:</text><text x="990" y="232" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">114 → no license fits → dropped</text><text x="990" y="252" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="start">77 → at least one fits → kept</text><rect x="990" y="310" width="116.8" height="26" rx="13" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.4"/><text x="1048.4" y="328" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">licenses.json</text><rect x="1288" y="140" width="290" height="210" rx="10" fill="#EAF5EA" stroke="#2E7D32" stroke-width="1.8"/><text x="1302" y="168" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="start">5 · 77 profiles</text><text x="1302" y="192" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">each with its list of correct</text><text x="1302" y="212" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">licenses (1–29, median 3)</text><text x="1302" y="232" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start"></text><text x="1302" y="252" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="start">saved for the next stage</text><rect x="1302" y="310" width="124.39999999999999" height="26" rx="13" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.4"/><text x="1364.2" y="328" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">profiles.jsonl</text><path d="M 330 245.0 L 348 245.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 642 245.0 L 660 245.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 954 245.0 L 972 245.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 1266 245.0 L 1284 245.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="976" y="380" width="290" height="64" rx="10" fill="#FDF0F0" stroke="#B91C1C" stroke-width="1.8"/><text x="1121.0" y="408" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#B91C1C" text-anchor="middle">114 dropped</text><text x="1121.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#333" text-anchor="middle">no license meets all requirements</text><path d="M 1121.0 350 L 1121.0 376" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><text x="40" y="452" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#6B4FBB" text-anchor="start">B · Turning profiles into realistic descriptions and evaluating Stage 1</text><rect x="40" y="535" width="290" height="210" rx="10" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.8"/><text x="54" y="563" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6B4FBB" text-anchor="start">6 · Write descriptions</text><text x="54" y="587" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">Qwen3.8-27B writes ~3 per</text><text x="54" y="607" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">profile in plain words, different</text><text x="54" y="627" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">personas, no license names</text><text x="54" y="647" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="start">→ 235 descriptions</text><rect x="54" y="705" width="124.39999999999999" height="26" rx="13" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.4"/><text x="116.19999999999999" y="723" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">profiles.jsonl</text><rect x="184.39999999999998" y="705" width="48.4" height="26" rx="13" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.4"/><text x="208.59999999999997" y="723" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">Groq</text><rect x="352" y="535" width="290" height="210" rx="10" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.8"/><text x="366" y="563" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6B4FBB" text-anchor="start">7 · Check them blind</text><text x="366" y="587" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">gpt-oss-20b reads each one</text><text x="366" y="607" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">WITHOUT the profile and lists</text><text x="366" y="627" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">the requirements it can see</text><text x="366" y="647" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start"></text><rect x="366" y="705" width="48.4" height="26" rx="13" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.4"/><text x="390.2" y="723" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">Groq</text><rect x="664" y="535" width="290" height="210" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="678" y="563" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start">8 · Keep exact matches</text><text x="678" y="587" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">recovered requirements</text><text x="678" y="607" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">= the profile?</text><text x="678" y="627" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="start">yes → 190 kept (70 profiles)</text><text x="678" y="647" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">no → 45 dropped</text><rect x="678" y="705" width="154.79999999999998" height="26" rx="13" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.4"/><text x="755.4" y="723" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">descriptions.jsonl</text><rect x="976" y="535" width="290" height="210" rx="10" fill="#EAF5EA" stroke="#2E7D32" stroke-width="1.8"/><text x="990" y="563" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="start">9 · Evaluate Stage 1</text><text x="990" y="587" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">gpt-oss-120b recommends 3</text><text x="990" y="607" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">licenses for each description,</text><text x="990" y="627" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">scored against step 5&#x27;s list</text><text x="990" y="647" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="start">→ 104 run (all 70 profiles)</text><rect x="990" y="705" width="170.0" height="26" rx="13" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.4"/><text x="1075.0" y="723" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">stage1_results.jsonl</text><rect x="1288" y="535" width="290" height="210" rx="10" fill="#F4F4F2" stroke="#8A8A85" stroke-width="1.8"/><text x="1302" y="563" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#8A8A85" text-anchor="start">Why only 104?</text><text x="1302" y="587" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">Groq free tier: 200k tokens</text><text x="1302" y="607" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">per day; one description per</text><text x="1302" y="627" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">profile ran first, so every</text><text x="1302" y="647" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">profile is covered</text><path d="M 330 640.0 L 348 640.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 642 640.0 L 660 640.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 954 640.0 L 972 640.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 1266 640.0 L 1284 640.0" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/><path d="M 1413.0 350 L 1413.0 478 L 185.0 478 L 185.0 531" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><text x="412" y="471" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#444" text-anchor="start" font-style="italic">requirements of each profile</text><path d="M 1453.0 350 L 1453.0 502 L 1121.0 502 L 1121.0 531" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#ah)"/><text x="1133.0" y="496" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#2E7D32" text-anchor="start" font-style="italic">correct licenses (answer key)</text><rect x="40" y="790" width="500" height="230" rx="10" fill="#FDF0F0" stroke="#B91C1C" stroke-width="1.8"/><text x="54" y="818" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#B91C1C" text-anchor="start">Example: dropped at step 4</text><text x="54" y="842" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">“trademarks protected” + “no attribution</text><text x="54" y="862" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">needed”</text><text x="54" y="882" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start"></text><text x="54" y="902" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">Every license that protects trademarks</text><text x="54" y="922" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">also requires keeping the copyright notice,</text><text x="54" y="942" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">so no license meets both → dropped.</text><rect x="560" y="790" width="480" height="230" rx="10" fill="#EAF5EA" stroke="#2E7D32" stroke-width="1.8"/><text x="574" y="818" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="start">Example: kept at step 4</text><text x="574" y="842" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">share changes (whole project)</text><text x="574" y="862" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">+ network use triggers sharing</text><text x="574" y="882" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">+ patent grant required</text><text x="574" y="902" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start"></text><text x="574" y="922" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">Correct licenses: AGPL-3.0, CeCILL-2.1,</text><text x="574" y="942" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">EUPL-1.1, EUPL-1.2, OSL-3.0</text><rect x="1060" y="790" width="500" height="230" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="1074" y="818" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F6DB5" text-anchor="start">Example: kept at step 8</text><text x="1074" y="842" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">Profile: no attribution needed</text><text x="1074" y="862" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">Qwen wrote: “… users don&#x27;t even have to</text><text x="1074" y="882" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">worry about keeping a copyright notice …”</text><text x="1074" y="902" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start"></text><text x="1074" y="922" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">gpt-oss-20b recovered: attribution = not</text><text x="1074" y="942" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">required, all else unspecified → exact match</text></svg>