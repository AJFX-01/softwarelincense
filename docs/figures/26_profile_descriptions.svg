<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs><rect width="1600" height="800" fill="#FFFFFF"/><text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#222" text-anchor="start" xml:space="preserve">One profile and the descriptions written from it</text><text x="40" y="80" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#555" text-anchor="start" xml:space="preserve">Profile P009 (3 requirements, 4 correct licenses) → three descriptions in different voices, each checked blind</text><rect x="40" y="120" width="470" height="290" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="54" y="148" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F6DB5" text-anchor="start" xml:space="preserve">Profile P009</text><text x="54" y="172" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#333" text-anchor="start" xml:space="preserve">Requirements:</text><text x="54" y="193" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">• contributors must grant patent rights</text><text x="54" y="214" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">• the license must NOT give rights to the</text><text x="54" y="235" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">   project&#x27;s name, logo or trademarks</text><text x="54" y="256" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">• people who modify the code should not</text><text x="54" y="277" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">   have to document what they changed</text><text x="54" y="298" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve"></text><text x="54" y="319" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#333" text-anchor="start" xml:space="preserve">Answer key (licenses that fit all three):</text><text x="54" y="340" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#333" text-anchor="start" xml:space="preserve">MPL-2.0 · MS-PL · MS-RL · MulanPSL-2.0</text><rect x="560" y="120" width="1000" height="200" rx="10" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.8"/><rect x="576" y="134" width="154.79999999999998" height="26" rx="13" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.4"/><text x="653.4" y="152" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle" xml:space="preserve">Hobbyist developer</text><text x="1544" y="152" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#2E7D32" text-anchor="end" xml:space="preserve">checker found: patent ✓  trademark ✓  no change notes ✓  → kept</text><text x="576" y="192" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">“I&#x27;m building an open-source CLI tool for organizing personal music libraries, and I want to ensure everyone who </text><text x="576" y="214" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">touches the code clearly gives permission to use my patents. It&#x27;s important that no one uses the project&#x27;s name </text><text x="576" y="236" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">or logo as their own brand … I don&#x27;t want to burden my contributors with having to … mark which lines they </text><text x="576" y="258" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">edited.” </text><rect x="560" y="336" width="1000" height="200" rx="10" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.8"/><rect x="576" y="350" width="132.0" height="26" rx="13" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.4"/><text x="642.0" y="368" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle" xml:space="preserve">Startup founder</text><text x="1544" y="368" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#2E7D32" text-anchor="end" xml:space="preserve">checker found: patent ✓  trademark ✓  no change notes ✓  → kept</text><text x="576" y="408" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">“Our company is releasing this data processing library … we need a clear patent grant for anyone using the </text><text x="576" y="430" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">software. We must strictly reserve all rights to our corporate name, trademarks, and logos … not requiring </text><text x="576" y="452" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">developers to maintain change logs or annotate their specific modifications.” </text><rect x="560" y="552" width="1000" height="200" rx="10" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.8"/><rect x="576" y="566" width="177.6" height="26" rx="13" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.4"/><text x="664.8" y="584" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle" xml:space="preserve">University researcher</text><text x="1544" y="584" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#2E7D32" text-anchor="end" xml:space="preserve">checker found: patent ✓  trademark ✓  no change notes ✓  → kept</text><text x="576" y="624" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">“I am publishing this simulation engine from our lab … I want to make sure the patent rights are explicitly </text><text x="576" y="646" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">handed over to the users. … the lab&#x27;s name and institutional logos are not covered by this release … we don&#x27;t </text><text x="576" y="668" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">want any obligation for students to document exactly what they changed.” </text><path d="M 510 265 L 556 265" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><text x="40" y="450" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222" text-anchor="start" xml:space="preserve">Personas across all 235 descriptions</text><rect x="40" y="470" width="170.0" height="26" rx="13" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.4"/><text x="125.0" y="488" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle" xml:space="preserve">startup founder · 29</text><rect x="218.0" y="470" width="215.6" height="26" rx="13" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.4"/><text x="325.8" y="488" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle" xml:space="preserve">university researcher · 25</text><rect x="40" y="504" width="230.79999999999998" height="26" rx="13" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.4"/><text x="155.39999999999998" y="522" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle" xml:space="preserve">freelance web developer · 12</text><rect x="278.79999999999995" y="504" width="109.19999999999999" height="26" rx="13" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.4"/><text x="333.4" y="522" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle" xml:space="preserve">hobbyist · 8</text><rect x="40" y="538" width="200.39999999999998" height="26" rx="13" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.4"/><text x="140.2" y="556" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle" xml:space="preserve">indie game developer · 7</text><rect x="248.39999999999998" y="538" width="124.39999999999999" height="26" rx="13" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.4"/><text x="310.59999999999997" y="556" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle" xml:space="preserve">researcher · 7</text><rect x="40" y="572" width="185.2" height="26" rx="13" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.4"/><text x="132.6" y="590" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle" xml:space="preserve">hobbyist developer · 6</text><rect x="233.2" y="572" width="192.79999999999998" height="26" rx="13" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.4"/><text x="329.59999999999997" y="590" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle" xml:space="preserve">academic researcher · 5</text><rect x="40" y="606" width="132.0" height="26" rx="13" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.4"/><text x="106.0" y="624" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle" xml:space="preserve">startup CTO · 5</text><rect x="180.0" y="606" width="101.6" height="26" rx="13" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.4"/><text x="230.8" y="624" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle" xml:space="preserve">student · 4</text><text x="40" y="666" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start" xml:space="preserve">122 different persona labels in total.</text><text x="40" y="690" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start" xml:space="preserve">The writer is asked for a different persona and project</text><text x="40" y="712" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start" xml:space="preserve">type in each description; the labels are its own.</text></svg>