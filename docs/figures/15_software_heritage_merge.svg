<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs><rect width="1600" height="860" fill="#FFFFFF"/><text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#222" text-anchor="start">Software Heritage: the tables we used and how we merged them</text><text x="40" y="80" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#555" text-anchor="start">Everything is joined onto the 20,000-file sample; the big tables are streamed so memory stays small</text><rect x="600" y="380" width="400" height="150" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="800.0" y="408" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F6DB5" text-anchor="middle">20,000 × 16 index</text><text x="800.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">one row per license file</text><text x="800.0" y="452" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">sample20k_index.csv</text><text x="800.0" y="472" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">100% matched · 96% dated · 95% with origin</text><rect x="40" y="395" width="330" height="120" rx="10" fill="#FFF4E5" stroke="#D9822B" stroke-width="1.8"/><text x="54" y="423" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D9822B" text-anchor="start">20,000 license texts</text><text x="54" y="447" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">blobs-sample20k (30 MB)</text><text x="54" y="467" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">file name = SHA1 hash</text><path d="M 370 455 L 596 455" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><text x="485" y="445" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle" font-style="italic">start here</text><rect x="300" y="120" width="340" height="140" rx="10" fill="#FFF4E5" stroke="#D9822B" stroke-width="1.8"/><text x="314" y="148" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D9822B" text-anchor="start">license-blobs</text><text x="314" y="172" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">6.48M rows</text><text x="314" y="192" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">adds: Software Heritage ID,</text><text x="314" y="212" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">file names (LICENSE, COPYING …)</text><rect x="700" y="120" width="340" height="140" rx="10" fill="#FFF4E5" stroke="#D9822B" stroke-width="1.8"/><text x="714" y="148" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D9822B" text-anchor="start">fileinfo</text><text x="714" y="172" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">6.0M rows</text><text x="714" y="192" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">adds: type, encoding,</text><text x="714" y="212" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">lines, words, size</text><rect x="1100" y="120" width="340" height="140" rx="10" fill="#FFF4E5" stroke="#D9822B" stroke-width="1.8"/><text x="1114" y="148" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D9822B" text-anchor="start">scancode</text><text x="1114" y="172" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">7.57M detections · 1,705 IDs</text><text x="1114" y="192" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">adds: detected licenses</text><text x="1114" y="212" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">+ confidence (0–100)</text><rect x="1160" y="390" width="340" height="140" rx="10" fill="#FFF4E5" stroke="#D9822B" stroke-width="1.8"/><text x="1174" y="418" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D9822B" text-anchor="start">earliest</text><text x="1174" y="442" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">5.75M rows</text><text x="1174" y="462" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">adds: first-seen date,</text><text x="1174" y="482" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">number of commits</text><rect x="1160" y="620" width="340" height="140" rx="10" fill="#FFF4E5" stroke="#D9822B" stroke-width="1.8"/><text x="1174" y="648" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D9822B" text-anchor="start">origins</text><text x="1174" y="672" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">5.70M rows</text><text x="1174" y="692" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">adds: one example</text><text x="1174" y="712" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">repository URL</text><path d="M 470 260 L 470 340 L 640 340 L 640 376" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><text x="478" y="292" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="start" font-style="italic">join on SHA1</text><path d="M 870 260 L 870 340 L 870 340 L 870 376" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><text x="878" y="292" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="start" font-style="italic">join on SHA1</text><path d="M 1270 260 L 1270 340 L 960 340 L 960 376" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><text x="1278" y="292" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="start" font-style="italic">join on SHA1</text><path d="M 1160 460 L 1004 460" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><text x="1080" y="450" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle" font-style="italic">join on SWHID</text><path d="M 1160 690 L 1080 690 L 1080 505 L 1004 505" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><text x="1072" y="600" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#444" text-anchor="end" font-style="italic">join on SWHID</text><rect x="600" y="640" width="400" height="110" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="800.0" y="668" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Sort each file into 5 groups</text><text x="800.0" y="692" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">clean · variant · multi ·</text><text x="800.0" y="712" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">out of scope · undetected → analysis</text><path d="M 800.0 530 L 800.0 636" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="640" width="420" height="110" rx="10" fill="#F4F4F2" stroke="#8A8A85" stroke-width="1.8" stroke-dasharray="7 5"/><text x="54" y="668" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#8A8A85" text-anchor="start">Not downloaded</text><text x="54" y="692" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">blobs.tar.zst — all 6.5M texts (14 GB)</text><text x="54" y="712" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">the random 20k sample is enough for analysis</text><text x="40" y="830" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#555" text-anchor="start">SHA1 = content hash used by fileinfo / scancode;  SWHID = Software Heritage ID used by earliest / origins.  license-blobs links the two.</text></svg>