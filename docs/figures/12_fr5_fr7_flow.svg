<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs><rect width="1600" height="790" fill="#FFFFFF"/><text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#222" text-anchor="start">How FR5, FR6 and FR7 work together</text><text x="40" y="80" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#555" text-anchor="start">Real example from the pipeline: a clinic app that will be sold, with a requirements.txt</text><rect x="30" y="100" width="1540" height="170" rx="12" fill="#FFF4E5" stroke="none"/><text x="48" y="155" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#D9822B" text-anchor="start">FR7 · Flag</text><text x="48" y="183" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">conflicts &amp; unknown</text><text x="48" y="203" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">dependency licenses</text><rect x="30" y="315" width="1540" height="170" rx="12" fill="#F1ECFB" stroke="none"/><text x="48" y="370" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#6B4FBB" text-anchor="start">FR5 · Explain</text><text x="48" y="398" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">plain-language claims</text><text x="48" y="418" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">that cite a clause</text><rect x="30" y="530" width="1540" height="170" rx="12" fill="#EAF5EA" stroke="none"/><text x="48" y="585" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2E7D32" text-anchor="start">FR6 · Verify</text><text x="48" y="613" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">label every claim</text><text x="48" y="633" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">against its clause</text><rect x="270" y="115" width="400" height="140" rx="9" fill="#FFFFFF" stroke="#D9822B" stroke-width="1.8"/><text x="286" y="145" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D9822B" text-anchor="start">Manifest uploaded</text><text x="286" y="173" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">requirements.txt</text><text x="286" y="195" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">requests · numpy · django</text><text x="286" y="217" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">pyqt5 · black · this-package-xyz</text><rect x="715" y="115" width="400" height="140" rx="9" fill="#FFFFFF" stroke="#D9822B" stroke-width="1.8"/><text x="731" y="145" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D9822B" text-anchor="start">Dependency lookup (PyPI / npm)</text><text x="731" y="173" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">requests  →  Apache-2.0</text><text x="731" y="195" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#D9822B" text-anchor="start">pyqt5  →  GPL-3.0-only</text><text x="731" y="217" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#B91C1C" text-anchor="start">this-package-xyz  →  not found (404)</text><rect x="1160" y="115" width="400" height="140" rx="9" fill="#FFFFFF" stroke="#D9822B" stroke-width="1.8"/><text x="1176" y="145" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D9822B" text-anchor="start">Warnings shown to the user</text><text x="1176" y="173" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">⚠  pyqt5 (GPL-3.0-only) limits the project</text><text x="1176" y="195" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">     to GPL-compatible licenses</text><text x="1176" y="217" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">?  this-package-xyz: license unknown,</text><text x="1176" y="239" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">     flagged, never guessed</text><rect x="270" y="330" width="400" height="140" rx="9" fill="#FFFFFF" stroke="#6B4FBB" stroke-width="1.8"/><text x="286" y="360" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6B4FBB" text-anchor="start">Recommendation (Stage 1 LLM)</text><text x="286" y="388" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#6B4FBB" text-anchor="start">#1  GPL-3.0</text><text x="286" y="410" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">reason: satisfies commercial sale and</text><text x="286" y="432" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">meets pyqt5&#x27;s GPL-3.0-only requirement</text><rect x="715" y="330" width="400" height="140" rx="9" fill="#FFFFFF" stroke="#6B4FBB" stroke-width="1.8"/><text x="731" y="360" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6B4FBB" text-anchor="start">Claim (Stage 2 LLM)</text><text x="731" y="388" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">“You may charge any price or no price for</text><text x="731" y="410" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">each copy you distribute, and you can</text><text x="731" y="432" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">also sell support or warranty services.”</text><rect x="1160" y="330" width="400" height="140" rx="9" fill="#FFFFFF" stroke="#6B4FBB" stroke-width="1.8"/><text x="1176" y="360" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6B4FBB" text-anchor="start">Citation + exact quote</text><text x="1176" y="388" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">cites clause C2 of GPL-3.0:</text><text x="1176" y="410" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">“You may charge any price or no price</text><text x="1176" y="432" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">for each copy that you convey …”</text><rect x="270" y="545" width="400" height="140" rx="9" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.8"/><text x="286" y="575" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="start">Step 1 · Quote check</text><text x="286" y="603" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">Does the quote appear in clause C2?</text><text x="286" y="625" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#2E7D32" text-anchor="start">✓  found word for word</text><text x="286" y="647" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">(missing quote  →  Unverified)</text><rect x="715" y="545" width="400" height="140" rx="9" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.8"/><text x="731" y="575" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="start">Step 2 · NLI check (DeBERTa-v3)</text><text x="731" y="603" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">premise     = clause C2</text><text x="731" y="625" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">hypothesis = the claim</text><text x="731" y="647" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#2E7D32" text-anchor="start">result: entailment (probability 0.99)</text><rect x="1160" y="545" width="400" height="140" rx="9" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.8"/><text x="1176" y="575" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="start">Step 3 · Label shown on the card</text><text x="1176" y="603" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#2E7D32" text-anchor="start">✓  Verified       ← entailment</text><text x="1176" y="625" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">?  Unverified    ← neutral</text><text x="1176" y="647" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">✗  Contradicted ← contradiction</text><path d="M 670 185.0 L 711 185.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 1115 185.0 L 1156 185.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 670 400.0 L 711 400.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 1115 400.0 L 1156 400.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 670 615.0 L 711 615.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 1115 615.0 L 1156 615.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 1360.0 255 L 1360.0 289 L 470.0 289 L 470.0 326" fill="none" stroke="#D9822B" stroke-width="2" marker-end="url(#ah)"/><text x="915.0" y="282" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#D9822B" text-anchor="middle">the constraint shapes the recommendation</text><path d="M 1360.0 470 L 1360.0 504 L 470.0 504 L 470.0 541" fill="none" stroke="#6B4FBB" stroke-width="2" marker-end="url(#ah)"/><text x="915.0" y="497" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#6B4FBB" text-anchor="middle">every claim + quote is checked</text><text x="40" y="768" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#555" text-anchor="start">The same flow runs for every claim on every recommended license; the user can open the cited clause from any badge.</text></svg>