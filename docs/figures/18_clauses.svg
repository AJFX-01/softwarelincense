<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#222" text-anchor="start">From license text to clauses, and finding the right clause</text><text x="40" y="80" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#555" text-anchor="start">812 clauses from 33 English licenses; each label is matched to the clause that states it</text><rect x="40" y="120" width="280" height="110" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="54" y="148" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F6DB5" text-anchor="start">1 · Split</text><text x="54" y="172" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">at blank lines</text><text x="54" y="192" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">into paragraphs</text><path d="M 320 175 L 336 175" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="340" y="120" width="280" height="110" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="354" y="148" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F6DB5" text-anchor="start">2 · Drop French</text><text x="354" y="172" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">non-English</text><text x="354" y="192" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">paragraphs removed</text><path d="M 620 175 L 636 175" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="640" y="120" width="280" height="110" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="654" y="148" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F6DB5" text-anchor="start">3 · Merge headings</text><text x="654" y="172" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">short lines (&lt; 80 chars)</text><text x="654" y="192" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">join the next paragraph</text><path d="M 920 175 L 936 175" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="940" y="120" width="280" height="110" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="954" y="148" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F6DB5" text-anchor="start">4 · Attach lead-ins</text><text x="954" y="172" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">text ending in “:” joins</text><text x="954" y="192" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">each list item below it</text><path d="M 1220 175 L 1236 175" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="1240" y="120" width="280" height="110" rx="10" fill="#EAF5EA" stroke="#2E7D32" stroke-width="1.8"/><text x="1254" y="148" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="start">5 · 812 clauses</text><text x="1254" y="172" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">median 329 characters;</text><text x="1254" y="192" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">all fit the 512-token limit</text><text x="40" y="280" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222" text-anchor="start">Example of step 4 (AFL-3.0)</text><rect x="40" y="295" width="700" height="200" rx="10" fill="#F4F4F2" stroke="#8A8A85" stroke-width="1.8"/><text x="54" y="323" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#8A8A85" text-anchor="start">Before: three separate paragraphs</text><text x="54" y="347" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">“1) Grant of Copyright License. Licensor grants You …</text><text x="54" y="367" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">    a license … to do the following:”</text><text x="54" y="387" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">“a) to reproduce the Original Work in copies …”</text><text x="54" y="407" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">“b) to translate, adapt, alter, transform, modify …”</text><text x="54" y="427" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">→ the first one stops at the colon and says nothing</text><rect x="860" y="295" width="700" height="200" rx="10" fill="#EAF5EA" stroke="#2E7D32" stroke-width="1.8"/><text x="874" y="323" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="start">After: each list item carries its lead-in</text><text x="874" y="347" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">“1) Grant of Copyright License. Licensor grants You …</text><text x="874" y="367" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">    to do the following: b) to translate, adapt,</text><text x="874" y="387" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">    alter, transform, modify …”</text><text x="874" y="407" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">→ a complete clause that clearly allows modification</text><path d="M 740 395 L 856 395" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><text x="40" y="560" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222" text-anchor="start">Finding the clause for a label (e.g. GPL-3.0 · liability)</text><rect x="40" y="580" width="280" height="110" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="54" y="608" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F6DB5" text-anchor="start">Label</text><text x="54" y="632" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">GPL-3.0 has</text><text x="54" y="652" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">“no liability”</text><path d="M 320 635 L 336 635" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="340" y="580" width="280" height="110" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="354" y="608" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start">Anchor phrases</text><text x="354" y="632" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">precise wording, e.g.</text><text x="354" y="652" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">“in no event … liable”</text><path d="M 620 635 L 636 635" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="640" y="580" width="280" height="110" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="654" y="608" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start">Keywords</text><text x="654" y="632" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">broad fallback,</text><text x="654" y="652" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">e.g. “liab”</text><path d="M 920 635 L 936 635" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="940" y="580" width="280" height="110" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="954" y="608" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start">Rank all clauses</text><text x="954" y="632" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">anchor hits → keyword</text><text x="954" y="652" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">hits → earliest</text><path d="M 1220 635 L 1236 635" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="1240" y="580" width="280" height="110" rx="10" fill="#EAF5EA" stroke="#2E7D32" stroke-width="1.8"/><text x="1254" y="608" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="start">Picked clause</text><text x="1254" y="632" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">“16. Limitation of Liability.</text><text x="1254" y="652" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">IN NO EVENT …”</text><rect x="40" y="730" width="1520" height="110" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="54" y="758" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start">Checked and used twice</text><text x="54" y="782" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">Read by hand on MIT, BSD, Apache-2.0, GPL-3.0, MPL-2.0 (e.g. liability → §16, not §17).  23 label–license pairs have no matching clause (mostly “commercial use”: BSD never says “sell”).</text><text x="54" y="802" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">Used to build the verifier test set (RQ2) and to choose the evidence clauses that Stage 2 quotes.</text></svg>