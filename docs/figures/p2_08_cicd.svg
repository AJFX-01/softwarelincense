<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs><rect width="1600" height="640" fill="#FFFFFF"/><text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#222" text-anchor="start" xml:space="preserve">CI/CD and GitHub workflow</text><text x="40" y="80" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#555" text-anchor="start" xml:space="preserve">Work lands on development; main only changes through a pull request whose checks pass</text><rect x="40" y="130" width="300" height="150" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="54" y="158" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start" xml:space="preserve">Developer</text><text x="54" y="182" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">edit code + tests locally</text><text x="54" y="202" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">pytest · ruff · pnpm build</text><text x="54" y="222" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">git push origin development</text><rect x="400" y="130" width="300" height="150" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="414" y="158" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F6DB5" text-anchor="start" xml:space="preserve">development branch</text><text x="414" y="182" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">integration branch</text><text x="414" y="202" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">every push runs CI</text><rect x="760" y="110" width="420" height="380" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="774" y="138" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start" xml:space="preserve">GitHub Actions  (.github/workflows/ci.yml)</text><rect x="785" y="165" width="370" height="145" rx="10" fill="#EAF5EA" stroke="#2E7D32" stroke-width="1.8"/><text x="799" y="193" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2E7D32" text-anchor="start" xml:space="preserve">Job: backend  (Python 3.14)</text><text x="799" y="217" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">pip install -r requirements-ci.txt</text><text x="799" y="236.5" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">ruff check licensewise scripts tests</text><text x="799" y="256.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">pytest -q   (27 tests, LLM + NLI mocked)</text><rect x="785" y="325" width="370" height="145" rx="10" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.8"/><text x="799" y="353" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#6B4FBB" text-anchor="start" xml:space="preserve">Job: ui  (Node 24, pnpm)</text><text x="799" y="377" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">pnpm install --frozen-lockfile</text><text x="799" y="396.5" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">pnpm lint     (oxlint)</text><text x="799" y="416.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">pnpm build    (tsc type-check + vite)</text><rect x="1240" y="130" width="320" height="150" rx="10" fill="#FFF4E5" stroke="#D9822B" stroke-width="1.8"/><text x="1254" y="158" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D9822B" text-anchor="start" xml:space="preserve">Pull request → main</text><text x="1254" y="182" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">development → main</text><text x="1254" y="202" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">merge only when backend</text><text x="1254" y="222" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">and ui checks are green</text><rect x="1240" y="340" width="320" height="150" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="1254" y="368" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F6DB5" text-anchor="start" xml:space="preserve">main branch</text><text x="1254" y="392" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">stable, demo-ready</text><text x="1254" y="412" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">CI runs again on merge</text><text x="1254" y="432" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">(branch protection)</text><path d="M 340 205 L 396 205" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><text x="368" y="197" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle" xml:space="preserve" font-style="italic">push</text><path d="M 700 205 L 756 205" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><text x="728" y="197" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle" xml:space="preserve" font-style="italic">trigger</text><path d="M 1180 205 L 1236 205" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><text x="1208" y="197" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle" xml:space="preserve" font-style="italic">✓ green</text><path d="M 1400 280 L 1400 336" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><text x="1420" y="314" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#444" text-anchor="start" xml:space="preserve" font-style="italic">merge</text><rect x="40" y="330" width="660" height="160" rx="10" fill="#F4F4F2" stroke="#8A8A85" stroke-width="1.8"/><text x="54" y="358" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#8A8A85" text-anchor="start" xml:space="preserve">Why the tests need no API key or model</text><text x="54" y="382" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">pipeline.recommend and llm.complete_json are replaced by fakes,</text><text x="54" y="402" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">the NLI model call (_nli) returns fixed probabilities, and the</text><text x="54" y="422" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">API uses a temporary SQLite file. CI installs no torch/transformers:</text><text x="54" y="442" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">fast (&lt; 1 s of tests) and free.</text><rect x="40" y="520" width="1520" height="90" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="54" y="548" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start" xml:space="preserve">What the checks protect</text><text x="54" y="572" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">API contract (202 + polling, reuse, 422/404, restart persistence) · manifest parsing · license normalising · Stage 1 prompt variants and retry · verifier quote check and label mapping · UI types and build</text></svg>