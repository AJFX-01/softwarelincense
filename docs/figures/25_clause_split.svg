<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#222" text-anchor="start" xml:space="preserve">Splitting a license into clauses: before and after</text><text x="40" y="80" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#555" text-anchor="start" xml:space="preserve">Example: AFL-3.0 section 1. Each list item becomes its own clause, with the sentence that introduces it attached</text><rect x="40" y="120" width="700" height="620" rx="10" fill="#F7F7F5" stroke="#C8C8C4" stroke-width="1.5"/><text x="56" y="148" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#D9822B" text-anchor="start" xml:space="preserve">Before: raw license text</text><text x="56" y="176" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#6B4FBB" text-anchor="start" xml:space="preserve">1) Grant of Copyright License. Licensor grants</text><text x="56" y="197" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#6B4FBB" text-anchor="start" xml:space="preserve">You a worldwide, royalty-free, non-exclusive,</text><text x="56" y="218" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#6B4FBB" text-anchor="start" xml:space="preserve">sublicensable license, for the duration of the</text><text x="56" y="239" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#6B4FBB" text-anchor="start" xml:space="preserve">copyright, to do the following:</text><text x="56" y="260" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve"></text><text x="56" y="281" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">  a) to reproduce the Original Work in copies,</text><text x="56" y="302" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">  either alone or as part of a collective work;</text><text x="56" y="323" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve"></text><text x="56" y="344" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">  b) to translate, adapt, alter, transform,</text><text x="56" y="365" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">  modify, or arrange the Original Work, thereby</text><text x="56" y="386" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">  creating derivative works (&quot;Derivative</text><text x="56" y="407" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">  Works&quot;) based upon the Original Work;</text><text x="56" y="428" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve"></text><text x="56" y="449" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">  c) to distribute or communicate copies of the</text><text x="56" y="470" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">  Original Work and Derivative Works to the</text><text x="56" y="491" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve">  public, under any license of your choice …</text><text x="56" y="512" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#2b2b2b" text-anchor="start" xml:space="preserve"></text><text x="56" y="533" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#B91C1C" text-anchor="start" xml:space="preserve">→ split at blank lines, the first paragraph says</text><text x="56" y="554" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#B91C1C" text-anchor="start" xml:space="preserve">  nothing on its own (it stops at “following:”)</text><path d="M 740 430 L 786 430" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="790" y="120" width="770" height="190" rx="10" fill="#EAF5EA" stroke="#2E7D32" stroke-width="1.8"/><text x="806" y="148" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#2E7D32" text-anchor="start" xml:space="preserve">Clause C2</text><text x="1544" y="148" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#444" text-anchor="end" xml:space="preserve">topic: copying</text><text x="806" y="176" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#6B4FBB" text-anchor="start" xml:space="preserve">Lead-in: “… 1) Grant of Copyright License. Licensor grants You a … license, …</text><text x="806" y="196" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#6B4FBB" text-anchor="start" xml:space="preserve">to do the following:”</text><text x="806" y="226" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#222" text-anchor="start" xml:space="preserve">a) to reproduce the Original Work in copies, either alone or as part of a </text><text x="806" y="248" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#222" text-anchor="start" xml:space="preserve">collective work; </text><rect x="790" y="326" width="770" height="190" rx="10" fill="#EAF5EA" stroke="#2E7D32" stroke-width="1.8"/><text x="806" y="354" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#2E7D32" text-anchor="start" xml:space="preserve">Clause C3</text><text x="1544" y="354" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#444" text-anchor="end" xml:space="preserve">topic: modifications ✓ label</text><text x="806" y="382" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#6B4FBB" text-anchor="start" xml:space="preserve">Lead-in: “… 1) Grant of Copyright License. Licensor grants You a … license, …</text><text x="806" y="402" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#6B4FBB" text-anchor="start" xml:space="preserve">to do the following:”</text><text x="806" y="432" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#222" text-anchor="start" xml:space="preserve">b) to translate, adapt, alter, transform, modify, or arrange the Original Work, </text><text x="806" y="454" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#222" text-anchor="start" xml:space="preserve">thereby creating derivative works … </text><rect x="790" y="532" width="770" height="190" rx="10" fill="#EAF5EA" stroke="#2E7D32" stroke-width="1.8"/><text x="806" y="560" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#2E7D32" text-anchor="start" xml:space="preserve">Clause C4</text><text x="1544" y="560" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#444" text-anchor="end" xml:space="preserve">topic: distribution ✓ label</text><text x="806" y="588" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#6B4FBB" text-anchor="start" xml:space="preserve">Lead-in: “… 1) Grant of Copyright License. Licensor grants You a … license, …</text><text x="806" y="608" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#6B4FBB" text-anchor="start" xml:space="preserve">to do the following:”</text><text x="806" y="638" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#222" text-anchor="start" xml:space="preserve">c) to distribute or communicate copies of the Original Work and Derivative Works </text><text x="806" y="660" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#222" text-anchor="start" xml:space="preserve">to the public, under any license … </text><text x="40" y="790" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start" xml:space="preserve">Purple = the lead-in sentence attached to every item · bold = the list item itself.</text><text x="40" y="816" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start" xml:space="preserve">Now each clause is complete on its own, so it can be quoted as evidence and checked by the verifier (512-token limit).</text><text x="40" y="842" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#2E7D32" text-anchor="start" xml:space="preserve">Result over all 33 English licenses: 812 clauses, median 329 characters.</text></svg>