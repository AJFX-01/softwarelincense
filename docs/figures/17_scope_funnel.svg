<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs><rect width="1600" height="800" fill="#FFFFFF"/><text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#222" text-anchor="start">Scoping the knowledge base: 47 → 34 licenses</text><text x="40" y="80" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#555" text-anchor="start">Two filters, then each remaining license is classed by its copyleft strength</text><rect x="40" y="130" width="300" height="150" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="190.0" y="211.0" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#2F6DB5" text-anchor="middle">47</text><text x="190.0" y="237.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#444" text-anchor="middle">licenses on choosealicense.com</text><rect x="650" y="130" width="300" height="150" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="800.0" y="211.0" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#2F6DB5" text-anchor="middle">39</text><text x="800.0" y="237.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#444" text-anchor="middle">software licenses</text><rect x="1260" y="130" width="300" height="150" rx="10" fill="#EAF5EA" stroke="#2E7D32" stroke-width="1.8"/><text x="1410.0" y="211.0" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#2E7D32" text-anchor="middle">34</text><text x="1410.0" y="237.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#444" text-anchor="middle">in scope</text><path d="M 340 205 L 646 205" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><text x="493" y="192" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle" font-style="italic">keep software only</text><path d="M 950 205 L 1256 205" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><text x="1103" y="192" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle" font-style="italic">keep OSI-approved only</text><rect x="360" y="300" width="270" height="190" rx="10" fill="#FDF0F0" stroke="#B91C1C" stroke-width="1.8"/><text x="374" y="328" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#B91C1C" text-anchor="start">−8 not for software</text><text x="374" y="352" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#333" text-anchor="start">CC-BY-4.0, CC-BY-SA-4.0 (media)</text><text x="374" y="371.5" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#333" text-anchor="start">GFDL-1.3 (documentation)</text><text x="374" y="391.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#333" text-anchor="start">ODbL-1.0 (data)</text><text x="374" y="410.5" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#333" text-anchor="start">OFL-1.1 (fonts)</text><text x="374" y="430.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#333" text-anchor="start">CERN-OHL-P/S/W (hardware)</text><rect x="970" y="300" width="270" height="150" rx="10" fill="#FDF0F0" stroke="#B91C1C" stroke-width="1.8"/><text x="984" y="328" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#B91C1C" text-anchor="start">−5 not OSI-approved</text><text x="984" y="352" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#333" text-anchor="start">BSD-3-Clause-Clear</text><text x="984" y="371.5" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#333" text-anchor="start">BSD-4-Clause</text><text x="984" y="391.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#333" text-anchor="start">CC0-1.0 · Vim · WTFPL</text><path d="M 493 205 L 493 296" fill="none" stroke="#B91C1C" stroke-width="2" marker-end="url(#ah)"/><path d="M 1103 205 L 1103 296" fill="none" stroke="#B91C1C" stroke-width="2" marker-end="url(#ah)"/><rect x="700" y="580" width="280" height="120" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="714" y="608" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F6DB5" text-anchor="start">Permissive · 21</text><text x="714" y="632" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">no same-license rule</text><text x="714" y="652" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">e.g. MIT, Apache-2.0, BSD</text><rect x="990" y="580" width="280" height="120" rx="10" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.8"/><text x="1004" y="608" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6B4FBB" text-anchor="start">Weak copyleft · 4</text><text x="1004" y="632" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">same license for the file</text><text x="1004" y="652" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">or library: LGPL, MPL-2.0</text><rect x="1280" y="580" width="280" height="120" rx="10" fill="#EAF5EA" stroke="#2E7D32" stroke-width="1.8"/><text x="1294" y="608" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="start">Strong copyleft · 9</text><text x="1294" y="632" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">whole work, same license:</text><text x="1294" y="652" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">GPL, AGPL, EUPL, EPL</text><path d="M 1410 280 L 1410 540 L 840 540 L 840 576" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 1130 540 L 1130 576" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 1420 540 L 1420 576" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="580" width="560" height="120" rx="10" fill="#F4F4F2" stroke="#8A8A85" stroke-width="1.8"/><text x="54" y="608" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#8A8A85" text-anchor="start">Language check</text><text x="54" y="632" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">share of common French words per paragraph</text><text x="54" y="652" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">→ CeCILL-2.1 is French-only: still recommended,</text><text x="54" y="672" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">but its claims can&#x27;t be verified (English-only verifier)</text><text x="40" y="770" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#555" text-anchor="start">Copyleft class comes straight from the labels: “same license” → strong · “same license (file / library)” → weak · neither → permissive.</text></svg>