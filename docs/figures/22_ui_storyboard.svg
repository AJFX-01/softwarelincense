<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1350" viewBox="0 0 1600 1350"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/></marker></defs><rect width="1600" height="1350" fill="#FFFFFF"/><text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#222" text-anchor="start">LicenseWise: from request to verified answer</text><text x="40" y="80" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#555" text-anchor="start">Four screens from the demo UI — what a developer sees, step by step</text><circle cx="58" cy="122" r="17" fill="#2a78d6"/><text x="58" y="128" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="86" y="128" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="start">Enter</text><text x="40" y="154" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#444" text-anchor="start">Describe the project in plain words (or upload a dependency list), then press Recommend.</text><image href="ui/ui_input.png" x="40" y="168" width="740" height="514" preserveAspectRatio="xMidYMin slice"/><rect x="40" y="168" width="740" height="514" fill="none" stroke="#c8c8c4" stroke-width="1.5" rx="6"/><circle cx="838" cy="122" r="17" fill="#2a78d6"/><text x="838" y="128" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="866" y="128" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="start">Send &amp; check</text><text x="820" y="154" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#444" text-anchor="start">The request goes to the backend; the pipeline runs step by step — lookup, recommend, explain, verify.</text><image href="ui/ui_running.png" x="820" y="168" width="740" height="514" preserveAspectRatio="xMidYMin slice"/><rect x="820" y="168" width="740" height="514" fill="none" stroke="#c8c8c4" stroke-width="1.5" rx="6"/><circle cx="58" cy="742" r="17" fill="#2a78d6"/><text x="58" y="748" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="86" y="748" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="start">Results</text><text x="40" y="774" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#444" text-anchor="start">Three licenses, each with a reason and claims marked verified, unverified or contradicted.</text><svg x="40" y="788" width="740" height="514" viewBox="0 410 1440 1000" preserveAspectRatio="xMidYMin slice"><image href="ui/ui_result.png" x="0" y="0" width="1440" height="1500"/></svg><rect x="40" y="788" width="740" height="514" fill="none" stroke="#c8c8c4" stroke-width="1.5" rx="6"/><circle cx="838" cy="742" r="17" fill="#2a78d6"/><text x="838" y="748" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="866" y="748" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="start">Evidence</text><text x="820" y="774" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#444" text-anchor="start">Click any claim to see the exact license clause it quotes and how sure the verifier is.</text><image href="ui/ui_evidence.png" x="820" y="788" width="740" height="514" preserveAspectRatio="xMidYMin slice"/><rect x="820" y="788" width="740" height="514" fill="none" stroke="#c8c8c4" stroke-width="1.5" rx="6"/><path d="M 780 430 L 816 430" fill="none" stroke="#2a78d6" stroke-width="3" marker-end="url(#ah)"/><path d="M 1190 682 L 1190 700 L 410 700 L 410 726" fill="none" stroke="#2a78d6" stroke-width="3" marker-end="url(#ah)"/><path d="M 780 1050 L 816 1050" fill="none" stroke="#2a78d6" stroke-width="3" marker-end="url(#ah)"/><text x="40" y="1336" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#555" text-anchor="start">Demo UI (React) — backend not yet connected; the results shown are saved outputs of the real pipeline.</text></svg>