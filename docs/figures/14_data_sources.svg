<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs><rect width="1600" height="800" fill="#FFFFFF"/><text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#222" text-anchor="start">Data sources: what we took and what it feeds</text><text x="40" y="80" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#555" text-anchor="start">Four public sources; every label used for evaluation comes from curated public data</text><text x="40" y="118" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#888" text-anchor="start">SOURCE</text><text x="560" y="118" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#888" text-anchor="start">WHAT WE TOOK</text><text x="1140" y="118" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#888" text-anchor="start">WHAT IT FEEDS</text><rect x="40" y="130" width="400" height="108" rx="10" fill="#FFF4E5" stroke="#D9822B" stroke-width="1.8"/><text x="54" y="158" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D9822B" text-anchor="start">Software Heritage license dataset</text><text x="54" y="182" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">6.5M license files from public code</text><text x="54" y="202" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">(GitHub, GitLab, Debian, PyPI, npm)</text><rect x="40" y="290" width="400" height="108" rx="10" fill="#FFF4E5" stroke="#D9822B" stroke-width="1.8"/><text x="54" y="318" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D9822B" text-anchor="start">choosealicense.com</text><text x="54" y="342" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">47 licenses, each with labels</text><text x="54" y="362" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">and the full license text</text><rect x="40" y="450" width="400" height="108" rx="10" fill="#FFF4E5" stroke="#D9822B" stroke-width="1.8"/><text x="54" y="478" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D9822B" text-anchor="start">SPDX License List (v3.29.0)</text><text x="54" y="502" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">740 official license IDs</text><text x="54" y="522" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">with OSI-approval flags</text><rect x="40" y="610" width="400" height="108" rx="10" fill="#FFF4E5" stroke="#D9822B" stroke-width="1.8"/><text x="54" y="638" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D9822B" text-anchor="start">PyPI / npm registries</text><text x="54" y="662" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">package metadata,</text><text x="54" y="682" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">queried live for each dependency</text><rect x="560" y="130" width="400" height="108" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="574" y="158" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start">5 metadata tables + 20,000 texts</text><text x="574" y="182" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">file info, detected licenses,</text><text x="574" y="202" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">dates, example repositories</text><rect x="560" y="290" width="400" height="108" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="574" y="318" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start">Labels + full text</text><text x="574" y="342" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">permissions · conditions ·</text><text x="574" y="362" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">limitations for each license</text><rect x="560" y="450" width="400" height="108" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="574" y="478" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start">License ID + OSI flag</text><text x="574" y="502" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">which licenses are OSI-approved;</text><text x="574" y="522" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">the list of valid IDs</text><rect x="560" y="610" width="400" height="108" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="574" y="638" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start">Each dependency&#x27;s license</text><text x="574" y="662" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">read from the package&#x27;s</text><text x="574" y="682" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">declared metadata</text><rect x="1140" y="130" width="400" height="108" rx="10" fill="#F4F4F2" stroke="#8A8A85" stroke-width="1.8"/><text x="1154" y="158" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#8A8A85" text-anchor="start">Analysis (EDA)</text><text x="1154" y="182" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">what licenses look like in the wild;</text><text x="1154" y="202" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">checks our scope covers 93.8%</text><text x="1526" y="158" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#888" text-anchor="end">offline</text><rect x="1140" y="290" width="400" height="108" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="1154" y="318" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F6DB5" text-anchor="start">Knowledge base</text><text x="1154" y="342" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">34 in-scope licenses,</text><text x="1154" y="362" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">812 clauses</text><text x="1526" y="318" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#2E7D32" text-anchor="end">used live</text><rect x="1140" y="450" width="400" height="108" rx="10" fill="#EAF5EA" stroke="#2E7D32" stroke-width="1.8"/><text x="1154" y="478" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="start">Ground truth</text><text x="1154" y="502" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">77 requirement profiles,</text><text x="1154" y="522" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">729 clause–claim pairs</text><text x="1526" y="478" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#888" text-anchor="end">offline</text><rect x="1140" y="610" width="400" height="108" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="1154" y="638" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F6DB5" text-anchor="start">Dependency check</text><text x="1154" y="662" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">FR3 lookup · FR7 conflict</text><text x="1154" y="682" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">and unknown-license flags</text><text x="1526" y="638" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#2E7D32" text-anchor="end">used live</text><path d="M 440 184.0 L 556 184.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 440 344.0 L 556 344.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 440 504.0 L 556 504.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 440 664.0 L 556 664.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 960 184.0 L 1136 184.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 960 344.0 L 1136 344.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 960 354.0 L 1136 494.0" fill="none" stroke="#999" stroke-width="2" marker-end="url(#ah)"/><path d="M 960 494.0 L 1136 354.0" fill="none" stroke="#999" stroke-width="2" marker-end="url(#ah)"/><path d="M 960 514.0 L 1136 654.0" fill="none" stroke="#999" stroke-width="2" marker-end="url(#ah)"/><path d="M 960 664.0 L 1136 664.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><text x="40" y="770" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#555" text-anchor="start">Planned for Phase 2: OSADL license-compatibility matrix (ground truth for checking manifests).</text></svg>