<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="750" viewBox="0 0 1600 750"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs><rect width="1600" height="750" fill="#FFFFFF"/><text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#222" text-anchor="start" xml:space="preserve">How the NLI verifier labels a claim</text><text x="40" y="80" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#555" text-anchor="start" xml:space="preserve">DeBERTa-v3-large reads the cited clause (premise) and the claim (hypothesis) and outputs three probabilities; the highest one becomes the badge</text><rect x="40" y="130" width="520" height="140" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.8"/><text x="54" y="158" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F6DB5" text-anchor="start" xml:space="preserve">Premise · cited clause (GPL-3.0, C2)</text><text x="54" y="182" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">“You may charge any price or no price for each</text><text x="54" y="203" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">copy that you convey, and you may offer support</text><text x="54" y="224" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">or warranty protection for a fee.”</text><rect x="40" y="300" width="520" height="140" rx="10" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.8"/><text x="54" y="328" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6B4FBB" text-anchor="start" xml:space="preserve">Hypothesis · claim written by Stage 2</text><text x="54" y="352" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">“You may charge any price or no price for each</text><text x="54" y="373" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">copy you distribute, and you can also sell support</text><text x="54" y="394" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">or warranty services.”</text><rect x="640" y="190" width="260" height="190" rx="10" fill="#EAF5EA" stroke="#2E7D32" stroke-width="1.8"/><text x="770.0" y="218" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="middle" xml:space="preserve">NLI model</text><text x="770.0" y="242" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="middle" xml:space="preserve">DeBERTa-v3-large</text><text x="770.0" y="262.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="middle" xml:space="preserve">pre-trained on public</text><text x="770.0" y="283.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="middle" xml:space="preserve">NLI datasets · runs</text><text x="770.0" y="303.5" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#333" text-anchor="middle" xml:space="preserve">locally · not trained by us</text><path d="M 560 200 L 636 260" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 560 370 L 636 310" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M 900 285 L 956 285" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="960" y="130" width="600" height="310" rx="10" fill="#FFFFFF" stroke="#C8C8C4" stroke-width="1.5"/><text x="976" y="160" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#222" text-anchor="start" xml:space="preserve">Output: three probabilities (sum to 1)</text><text x="976" y="217" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">entailment</text><rect x="1110" y="202" width="330" height="20" rx="4" fill="#F1F1EF" stroke="#C8C8C4"/><rect x="1110" y="202" width="328.02" height="20" rx="4" fill="#2E7D32"/><text x="1456" y="217" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2E7D32" text-anchor="start" xml:space="preserve">0.994</text><text x="976" y="271" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">neutral</text><rect x="1110" y="256" width="330" height="20" rx="4" fill="#F1F1EF" stroke="#C8C8C4"/><rect x="1110" y="256" width="2" height="20" rx="4" fill="#B45309"/><text x="1456" y="271" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#B45309" text-anchor="start" xml:space="preserve">0.006</text><text x="976" y="325" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">contradiction</text><rect x="1110" y="310" width="330" height="20" rx="4" fill="#F1F1EF" stroke="#C8C8C4"/><rect x="1110" y="310" width="2" height="20" rx="4" fill="#B91C1C"/><text x="1456" y="325" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#B91C1C" text-anchor="start" xml:space="preserve">0.000</text><text x="976" y="395" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="start" xml:space="preserve">Highest = entailment  →  badge: ✓ Verified</text><text x="40" y="500" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222" text-anchor="start" xml:space="preserve">The rule (plus one check before it)</text><rect x="40" y="520" width="370" height="120" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.8"/><text x="54" y="548" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="start" xml:space="preserve">0 · Quote check</text><text x="54" y="580" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">the quote must appear word for word in </text><text x="54" y="600" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">the cited clause — otherwise Unverified, </text><text x="54" y="620" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">no NLI run </text><rect x="423" y="520" width="370" height="120" rx="10" fill="#EAF5EA" stroke="#2E7D32" stroke-width="1.8"/><text x="437" y="548" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="start" xml:space="preserve">entailment highest</text><text x="437" y="580" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">the clause supports the claim → ✓ </text><text x="437" y="600" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">Verified </text><rect x="806" y="520" width="370" height="120" rx="10" fill="#F4F4F2" stroke="#8A8A85" stroke-width="1.8"/><text x="820" y="548" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#8A8A85" text-anchor="start" xml:space="preserve">neutral highest</text><text x="820" y="580" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">the clause doesn&#x27;t say → ? Unverified </text><rect x="1189" y="520" width="370" height="120" rx="10" fill="#FDF0F0" stroke="#B91C1C" stroke-width="1.8"/><text x="1203" y="548" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#B91C1C" text-anchor="start" xml:space="preserve">contradiction highest</text><text x="1203" y="580" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">the clause says the opposite → ✗ </text><text x="1203" y="600" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start" xml:space="preserve">Contradicted </text><text x="40" y="690" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start" xml:space="preserve">Another real case: AGPL-3.0 §6 vs “you must also make the full source code available at no extra cost” → contradiction 0.58 vs entailment 0.38</text><text x="40" y="714" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start" xml:space="preserve">→ shown as Contradicted, although the claim is broadly right: a known verifier error (slide 18b).</text></svg>