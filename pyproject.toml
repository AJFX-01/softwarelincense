# Tool settings only (LicenseWise is run from the repo, not installed as a package).
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["notebooks", "ui"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "E741", "B905"]  # long lines, `l` for a license record, zip lengths checked by construction
