# CI: runs on every push to development or main, and on pull requests into them.
# Branches: development = integration (work lands here first); main = stable,
# demo-ready (updated only by merging a development PR whose checks pass).
# - backend: lint (ruff) + unit/API tests (pytest). The LLM and the NLI model are
#   mocked, so no API key, no GPU and no 1.7 GB model download are needed.
# - ui: lint (oxlint) + type-check and production build (tsc + vite).
name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Lint
        run: ruff check licensewise scripts tests
      - name: Tests
        run: pytest -q

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type-check and build
        run: pnpm build
